<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stamp Counter</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff8e9;
      --bench: #ece2c9;
      --ink: #211c33;
      --ink-soft: #60556b;
      --accent: #ec624e;
      --accent-light: #ffe0ad;
      --accent-shadow: #872b35;
      --spring: linear(0, .22 9%, .78 21%, 1.14 39%, 1.05 53%, .98 68%, 1.01 84%, 1);
      font: 16px/1.5 system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(14px, 4vw, 54px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bench);
      color: var(--ink);
    }
    main {
      position: relative;
      isolation: isolate;
      display: grid;
      justify-items: center;
      align-content: center;
      width: min(100%, 1140px);
      min-height: clamp(430px, 75vh, 710px);
      padding: 42px 18px;
      border: 2px solid var(--ink);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 9px 9px 0 var(--ink);
      text-align: center;
    }
    main::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px dashed #b3a28d;
      border-radius: 16px;
      pointer-events: none;
      z-index: -1;
    }
    h1 {
      margin: 0;
      font: 900 clamp(2.7rem, 8vw, 6.3rem)/.95 Georgia, serif;
      letter-spacing: -.06em;
    }
    .instructions {
      margin: 12px 0 0;
      color: var(--ink-soft);
      font-size: clamp(.95rem, 2vw, 1.2rem);
    }
    output {
      display: grid;
      place-items: center;
      min-width: 5em;
      min-height: 1.8em;
      margin: clamp(20px, 5vh, 44px) 0;
      border-block: 2px solid var(--ink);
      font: 800 clamp(1.5rem, 5vw, 3.2rem)/1 system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: clamp(36px, 8vh, 70px);
    }
    button {
      min-height: 48px;
      padding: 11px 17px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      color: var(--ink);
      background: var(--paper);
      font: 800 1rem/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }
    button:disabled { opacity: .46; cursor: default; }
    #stamp {
      padding-inline: clamp(16px, 5vw, 38px);
      background: var(--accent);
      box-shadow: 0 5px 0 var(--accent-shadow), 0 7px 0 var(--ink);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: no-preference) {
      #stamp:active { transform: translateY(4px) scale(1.04, .9); }
      #stamp.rebound {
        animation: stamp-rebound 300ms ease-out both;
        animation-timing-function: var(--spring);
      }
    }
    @keyframes stamp-rebound {
      from { transform: translateY(4px) scale(1.06, .86); }
      to { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Stamp Counter</h1>
    <p class="instructions" id="instructions">Add a stamp to the card, or clear the count to start again.</p>
    <output id="count" aria-live="polite" aria-atomic="true">0 stamps</output>
    <div class="actions">
      <button id="stamp" type="button" aria-describedby="instructions">Stamp card</button>
      <button id="clear" type="button" disabled>Clear card</button>
    </div>
    <canvas aria-hidden="true"></canvas>
  </main>
  <script>
    const panel = document.querySelector('main');
    const stamp = document.querySelector('#stamp');
    const clear = document.querySelector('#clear');
    const count = document.querySelector('#count');
    const canvas = document.querySelector('canvas');
    const pen = canvas.getContext('2d');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    let stamps = 0;
    let frame = 0;
    let scale = 1;
    let effects = [];
    let palette;

    function clearEffects() {
      cancelAnimationFrame(frame);
      frame = 0;
      effects = [];
      pen?.clearRect(0, 0, canvas.width / scale, canvas.height / scale);
    }

    function fitCanvas() {
      if (!pen) return;
      const { width, height } = canvas.getBoundingClientRect();
      scale = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      pen.setTransform(scale, 0, 0, scale, 0, 0);
      clearEffects();
    }

    function recordStamp() {
      stamps += 1;
      count.value = `${stamps} ${stamps === 1 ? 'stamp' : 'stamps'}`;
      clear.disabled = false;
      if (reducedMotion.matches) return;

      stamp.classList.remove('rebound');
      // Measure after removing the old animation so a rapid press can replay it.
      const button = stamp.getBoundingClientRect();
      stamp.classList.add('rebound');
      if (!pen) return;

      const surface = canvas.getBoundingClientRect();
      const colors = getComputedStyle(panel);
      palette = {
        outline: colors.getPropertyValue('--ink').trim(),
        ink: colors.getPropertyValue('--accent').trim(),
        fill: colors.getPropertyValue('--accent-light').trim(),
      };
      effects.push({
        x: button.left + button.width / 2 - surface.left,
        y: button.top - surface.top + 6,
        start: performance.now(),
      });
      if (effects.length > 5) effects.shift();
      if (!frame) frame = requestAnimationFrame(draw);
    }

    function draw(now) {
      pen.clearRect(0, 0, canvas.width / scale, canvas.height / scale);
      effects = effects.filter(effect => now - effect.start < 530);
      for (const effect of effects) paintImpact(effect, now);
      frame = effects.length ? requestAnimationFrame(draw) : 0;
    }

    function paintImpact(effect, now) {
      const time = Math.max(0, (now - effect.start) / 530);
      const travel = 1 - (1 - time) ** 3;
      const radius = 27 + 62 * travel;

      pen.save();
      pen.translate(effect.x, effect.y - 16);
      pen.globalAlpha = Math.min(1, (1 - time) * 1.7);
      pen.lineCap = 'round';
      pen.strokeStyle = palette.ink;
      pen.lineWidth = 4 - 2 * time;

      for (let index = 0; index < 7; index += 1) {
        const angle = Math.PI + index * Math.PI / 6;
        const length = 11 + (index % 3) * 5;
        pen.beginPath();
        pen.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
        pen.lineTo(Math.cos(angle) * (radius + length), Math.sin(angle) * (radius + length));
        pen.stroke();
      }

      pen.translate(0, -25 - 44 * travel);
      pen.rotate(-.12);
      const size = 18 + 20 * travel;
      pen.font = `900 italic ${size}px system-ui`;
      pen.textAlign = 'center';
      pen.textBaseline = 'middle';
      pen.lineJoin = 'round';
      pen.strokeStyle = palette.outline;
      pen.fillStyle = palette.fill;
      pen.lineWidth = 5;
      pen.strokeText('THUMP', 0, 0);
      pen.fillText('THUMP', 0, 0);
      pen.restore();
    }

    stamp.addEventListener('click', recordStamp);
    stamp.addEventListener('animationend', () => stamp.classList.remove('rebound'));
    clear.addEventListener('click', () => {
      stamps = 0;
      count.value = '0 stamps';
      stamp.focus();
      clear.disabled = true;
      clearEffects();
    });
    reducedMotion.addEventListener('change', () => {
      stamp.classList.remove('rebound');
      clearEffects();
    });
    new ResizeObserver(fitCanvas).observe(canvas);
  </script>
</body>
</html>
